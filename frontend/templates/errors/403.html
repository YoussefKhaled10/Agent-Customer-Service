{% extends "base.html" %}
{% block title %}Access Denied | PharmaCare{% endblock %}
{% block body %}
<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8f8">
  <section style="width:min(520px,100%);padding:38px;border:1px solid #d8e4e7;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(20,55,70,.08)">
    <div style="display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#fdebed;color:#b43b45;font-size:34px">!</div>
    <h1 style="margin:0 0 10px;color:#123047">Admin access required</h1>
    <p style="color:#6f8796;line-height:1.7">This area is available only to active administrator accounts.</p>
    <div style="display:flex;justify-content:center;gap:10px;margin-top:24px">
      <a href="/chat" style="padding:11px 18px;border:1px solid #d8e4e7;border-radius:11px;color:#123047;text-decoration:none">Back to chat</a>
      <a href="/login" style="padding:11px 18px;border-radius:11px;background:#168f8b;color:#fff;text-decoration:none">Sign in</a>
    </div>
  </section>
</main>
{% endblock %}
